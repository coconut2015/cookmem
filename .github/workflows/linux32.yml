name: Linux 32-bit

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux32-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: GCC i386 ${{ matrix.config }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # g++-multilib provides the 32-bit C++ runtime for -m32.  64-bit Linux
      # builds are tested by CircleCI.
      - name: Install 32-bit compiler support
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-multilib

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DCMAKE_CXX_FLAGS=-m32

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
