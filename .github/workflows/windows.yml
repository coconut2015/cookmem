name: Windows

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.toolset }} ${{ matrix.arch }} ${{ matrix.config }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        toolset: [MSVC, ClangCL]
        arch: [x64, Win32]
        config: [Debug, Release]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Uses CMake directly rather than make.cmd, so that a failing build or
      # test fails the job.  ClangCL is the clang-cl toolset that comes with
      # Visual Studio.
      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.arch }} ${{ matrix.toolset == 'ClangCL' && '-T ClangCL' || '' }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure
