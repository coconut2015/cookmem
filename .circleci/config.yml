version: 2.1
orbs:
  codecov: codecov/codecov@6.1.0
jobs:
  build_and_test:
    docker:
      - image: cimg/base:2025.09-24.04  # Ubuntu 24.04.2 LTS
    steps:
      - checkout
      - run:
          name: Install packages
          command: sudo apt-get update && sudo apt-get install -y g++ cmake lcov
      - run:
          name: Build and test
          command: chmod +x make.sh && ./make.sh cov
      # Upload only the lcov report created by "make test_coverage", which
      # already excludes system headers, tests, examples and performance
      # tests.  Requires CODECOV_TOKEN in the CircleCI project settings.
      - codecov/upload:
          files: cov/test_coverage.info
          disable_search: true
          plugins: noop
          fail_on_error: true
workflows:
  all:
    jobs:
      - build_and_test
